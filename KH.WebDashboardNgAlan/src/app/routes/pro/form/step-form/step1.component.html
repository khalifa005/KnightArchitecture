<form nz-form [formGroup]="form" (ngSubmit)="_submitForm()">
  <div se-container="1" labelWidth="100">
    <se [label]="'step_form.payment_account' | i18n" required>
      <nz-select formControlName="pay_account">
        <nz-option [nzLabel]="item.pay_account" [nzValue]="item.pay_account" />
      </nz-select>
    </se>
    <se [label]="'step_form.receiver_account' | i18n" [error]="'step_form.receiver_account_error' | i18n" required>
      <nz-input-group nzCompact>
        <nz-select formControlName="receiver_type" style="width: 100px">
          <nz-option [nzLabel]="'step_form.alipay' | i18n" [nzValue]="'alipay'" />
          <nz-option [nzLabel]="'step_form.bank_account' | i18n" [nzValue]="'bank'" />
        </nz-select>
        <input formControlName="receiver_account" nz-input style="width: calc(100% - 100px)" />
      </nz-input-group>
    </se>
    <se [label]="'step_form.receiver_name' | i18n" [error]="'step_form.receiver_name_error' | i18n" required>
      <input nz-input formControlName="receiver_name" />
    </se>
    <se [label]="'step_form.transfer_amount' | i18n" [error]="'step_form.transfer_amount_error' | i18n" required>
      <input nz-input formControlName="amount" id="amount" nzAddonAfter="￥" />
    </se>
    <se>
      <button nz-button nzType="primary" [disabled]="form.invalid">{{ 'step_form.next_step' | i18n }}</button>
    </se>
  </div>
</form>
<div class="border-top-1 mt-lg px-lg text-grey-dark">
  <h3 class="h3 my-md">{{ 'step_form.instructions' | i18n }}</h3>
  <h4 class="h4 mb-sm">{{ 'step_form.transfer_to_alipay' | i18n }}</h4>
  <p class="mb-sm">
    {{ 'step_form.alipay_instructions' | i18n }}
  </p>
  <h4 class="h4 mb-sm">{{ 'step_form.transfer_to_bank_card' | i18n }}</h4>
  <p>
    {{ 'step_form.bank_card_instructions' | i18n }}
  </p>
</div>
