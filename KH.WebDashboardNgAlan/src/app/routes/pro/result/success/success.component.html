<page-header />
<nz-card>
  <nz-result nzStatus="success" [nzTitle]="'result.submit_success' | i18n"
    [nzSubTitle]="'result.submit_result_page_description' | i18n">
    <div nz-result-extra>
      <div nz-row [nzGutter]="16" class="mb-md">
        <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="12" [nzXl]="6">
          <span class="text-grey-darker">{{ 'result.project_id' | i18n }}</span>
          23421
        </div>
        <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="12" [nzXl]="6">
          <span class="text-grey-darker">{{ 'result.responsible_person' | i18n }}</span>
          User1
        </div>
        <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24" [nzXl]="12">
          <span class="text-grey-darker">{{ 'result.effective_time' | i18n }}</span>
          2016-12-12 ~ 2017-12-12
        </div>
      </div>
      <nz-steps [nzCurrent]="1" nzProgressDot class="mb-lg">
        <nz-step [nzTitle]="'result.create_project' | i18n" [nzDescription]="createDesc">
          <ng-template #createDesc>
            <div style="font-size: 14px; position: relative; left: 38px">
              <div style="margin-top: 8px; margin-bottom: 4px">
                User1
                <i nz-icon nzType="dingding" class="ml-sm"></i>
              </div>
              <div style="margin-top: 8px; margin-bottom: 4px">2016-12-12 12:32</div>
            </div>
          </ng-template>
        </nz-step>
        <nz-step [nzTitle]="'result.department_initial_review' | i18n" [nzDescription]="checkedDesc">
          <ng-template #checkedDesc>
            <div style="font-size: 14px; position: relative; left: 38px">
              <div style="margin-top: 8px; margin-bottom: 4px">
                User2
                <i nz-icon nzType="dingding" class="ml-sm" style="color: #00a0e9"></i>
              </div>
              <div style="margin-top: 8px; margin-bottom: 4px">
                <a (click)="msg.success('click')">{{ 'result.urge' | i18n }}</a>
              </div>
            </div>
          </ng-template>
        </nz-step>
        <nz-step [nzTitle]="'result.financial_review' | i18n" />
        <nz-step [nzTitle]="'result.complete' | i18n" />
      </nz-steps>
      <button nz-button [nzType]="'primary'">{{ 'result.return_list' | i18n }}</button>
      <button nz-button>{{ 'result.view_project' | i18n }}</button>
      <button nz-button>{{ 'result.print' | i18n }}</button>
    </div>
  </nz-result>
</nz-card>
