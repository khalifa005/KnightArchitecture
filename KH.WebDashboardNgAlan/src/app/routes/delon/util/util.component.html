<div class="alain-default__content-title">
  <h1>
    {{ 'util.toolkit' | i18n }}
    <small>{{ 'util.delon_util_daily_usage' | i18n }}</small>
  </h1>
</div>
<nz-row [nzGutter]="16">
  <nz-col [nzSpan]="12">
    <nz-card [nzTitle]="'util.string_class' | i18n">
      <nz-card nzType="inner" nzTitle="format">
        <form nz-form>
          <nz-form-item>
            <nz-form-label [nzSm]="8">String</nz-form-label>
            <nz-form-control [nzSm]="16">
              <input nz-input [(ngModel)]="format_str" [ngModelOptions]="{ standalone: true }" />
            </nz-form-control>
          </nz-form-item>
          <nz-form-item>
            <nz-form-label [nzSm]="8">Object</nz-form-label>
            <nz-form-control [nzSm]="16">
              <input nz-input [(ngModel)]="format_obj" [ngModelOptions]="{ standalone: true }" />
            </nz-form-control>
          </nz-form-item>
          <nz-form-item>
            <nz-form-control [nzSpan]="16" [nzOffset]="8">
              <button (click)="onFormat()" nz-button>{{ 'util.run' | i18n }}</button>
            </nz-form-control>
          </nz-form-item>
          <nz-form-item>
            <nz-form-label [nzSm]="8">{{ 'util.result' | i18n }}</nz-form-label>
            <nz-form-control [nzSm]="16">
              {{ format_res }}
            </nz-form-control>
          </nz-form-item>
        </form>
      </nz-card>
      <nz-card nzType="inner" nzTitle="yuan">
        <nz-row [nzGutter]="16">
          <nz-col [nzSpan]="12">
            <input type="number" nz-input [(ngModel)]="yuan_str" (ngModelChange)="onYuan($event)" />
          </nz-col>
          <nz-col [nzSpan]="12">
            <div [innerHTML]="yuan_res"></div>
          </nz-col>
        </nz-row>
      </nz-card>
    </nz-card>
  </nz-col>
  <nz-col [nzSpan]="12">
    <nz-card [nzTitle]="'util.other_class' | i18n">
      <button nz-button (click)="onCopy()">{{ 'util.copy' | i18n }}</button>
    </nz-card>
  </nz-col>
</nz-row>
