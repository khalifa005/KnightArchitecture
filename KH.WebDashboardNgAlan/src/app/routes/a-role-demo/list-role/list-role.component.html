<page-header [title]="'Role Management'" />
<nz-card [nzBordered]="false">
   <!-- Search Form -->
   <form nz-form [nzLayout]="'inline'" (ngSubmit)="onSearch()" class="search__form">
      <div nz-row [nzGutter]="{ xs: 8, sm: 8, md: 8, lg: 24, xl: 48, xxl: 48 }">
         <div nz-col nzMd="8" nzSm="24">
            <nz-form-item>
               <nz-form-label nzFor="name_en">Name (English)</nz-form-label>
               <nz-form-control>
                  <input nz-input [(ngModel)]="q.name_en" name="name_en" [placeholder]="'Enter English name'"
                     id="name_en" />
               </nz-form-control>
            </nz-form-item>
         </div>
         <div nz-col nzMd="8" nzSm="24">
            <nz-form-item>
               <nz-form-label nzFor="name_ar">Name (Arabic)</nz-form-label>
               <nz-form-control>
                  <input nz-input [(ngModel)]="q.name_ar" name="name_ar" [placeholder]="'Enter Arabic name'"
                     id="name_ar" />
               </nz-form-control>
            </nz-form-item>
         </div>
         <div nz-col nzMd="8" nzSm="24">
            <nz-form-item>
               <nz-form-label nzFor="created_by">Created By</nz-form-label>
               <nz-form-control>
                  <input nz-input [(ngModel)]="q.created_by" name="created_by" [placeholder]="'Enter creator name'"
                     id="created_by" />
               </nz-form-control>
            </nz-form-item>
         </div>
         <div nz-col nzMd="8" nzSm="24">
            <nz-form-item>
               <nz-form-label nzFor="edited_by">Edited By</nz-form-label>
               <nz-form-control>
                  <input nz-input [(ngModel)]="q.edited_by" name="edited_by" [placeholder]="'Enter editor name'"
                     id="edited_by" />
               </nz-form-control>
            </nz-form-item>
         </div>
         <div nz-col nzMd="8" nzSm="24">
            <nz-form-item>
               <nz-form-control>
                  <nz-space>
                     <button nz-button nzType="primary" (click)="onSearch()">
                        <span nz-icon nzType="search"></span>
                        Search
                     </button>
                     <button nz-button (click)="onReset()">
                        <span nz-icon nzType="reload"></span>
                        Reset
                     </button>
                  </nz-space>
               </nz-form-control>
            </nz-form-item>
         </div>
      </div>
   </form>

   <!-- Action Buttons -->
   <div class="table-operations">
      <nz-space>
         <button nz-button nzType="primary" (click)="removeSelected()" [disabled]="selectedRows.length === 0">
            <span nz-icon nzType="delete"></span>
            Delete Selected ({{ selectedRows.length }})
         </button>
         <button nz-button nzType="default" (click)="addNewRole()">
            <span nz-icon nzType="plus"></span>
            Add New Role
         </button>
      </nz-space>
   </div>

   <!-- Data Table -->
   <st #st [data]="data" [columns]="columns" [loading]="loading" [total]="total"
      [page]="{ front: false, show: true, showSize: true, pageSizes: [10, 20, 50, 100] }" (change)="stChange($event)">
   </st>
</nz-card>
