<form [formGroup]="form" class="bg-surface-container-low rounded-xl p-6 mb-8 flex flex-wrap items-center gap-4">
    <div class="flex-1 min-w-[240px]">
        <div class="relative">
            <span class="material-symbols-outlined absolute start-4 top-1/2 -translate-y-1/2 text-outline z-10" data-icon="search">search</span>
            <input pInputText formControlName="searchQuery" class="w-full ps-12 pe-4 py-3 bg-surface-container-lowest rounded-full border-none focus:ring-2 focus:ring-primary/20 text-sm font-body" [placeholder]="'medicalRecords.search_placeholder' | transloco" type="text"/>
        </div>
    </div>
    <div class="flex flex-wrap items-center gap-3">
        <!-- Date Range Native -->
        <input type="date" formControlName="dateRange" class="bg-surface-container-lowest rounded-full border-none text-sm px-4 py-3 hover:bg-white transition-colors cursor-pointer w-full md:w-auto text-on-surface-variant outline-none focus:ring-2 focus:ring-primary/20" />
        
        <!-- Type Native Dropdown -->
        <select formControlName="type" class="bg-surface-container-lowest rounded-full border-none text-sm px-4 py-3 hover:bg-white transition-colors cursor-pointer w-full md:w-auto outline-none focus:ring-2 focus:ring-primary/20 appearance-none pe-8 text-on-surface-variant">
            <option [ngValue]="null">{{ 'medicalRecords.type_all' | transloco }}</option>
            @for (type of types; track type.value) {
                <option [ngValue]="type.value">{{ type.label }}</option>
            }
        </select>
        
        <!-- Provider Native Dropdown -->
        <select formControlName="provider" class="bg-surface-container-lowest rounded-full border-none text-sm px-4 py-3 hover:bg-white transition-colors cursor-pointer w-full md:w-auto outline-none focus:ring-2 focus:ring-primary/20 appearance-none pe-8 text-on-surface-variant">
            <option [ngValue]="null">{{ 'medicalRecords.provider' | transloco }}</option>
            @for (provider of providers; track provider.value) {
                <option [ngValue]="provider.value">{{ provider.label }}</option>
            }
        </select>
    </div>
</form>
