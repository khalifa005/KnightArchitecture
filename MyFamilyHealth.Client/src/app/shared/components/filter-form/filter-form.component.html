<form [formGroup]="form" class="bg-surface-container-low rounded-xl p-6 mb-8 flex flex-wrap items-center gap-4">
    <div class="flex-1 min-w-[240px]">
        <div class="relative">
            <span class="material-symbols-outlined absolute start-4 top-1/2 -translate-y-1/2 text-outline z-10" data-icon="search">search</span>
            <input pInputText formControlName="searchQuery" class="w-full ps-12 pe-4 py-3 bg-surface-container-lowest rounded-full border-none focus:ring-2 focus:ring-primary/20 text-sm font-body" [placeholder]="'medicalRecords.search_placeholder' | transloco" type="text"/>
        </div>
    </div>
    <div class="flex flex-wrap items-center gap-3">
        <!-- Date Range Native -->
        <p-datepicker formControlName="dateRange" selectionMode="range" styleClass="w-full md:w-auto" inputStyleClass="bg-surface-container-lowest rounded-full border-none text-sm px-4 py-3 hover:bg-white transition-colors cursor-pointer w-full focus:ring-2 focus:ring-primary/20 text-on-surface-variant" placeholder="{{ 'medicalRecords.date_range' | transloco }}"></p-datepicker>
        
        <!-- Type Dropdown -->
        <p-select formControlName="type" [options]="types" optionLabel="label" optionValue="value" placeholder="{{ 'medicalRecords.type_all' | transloco }}" styleClass="bg-surface-container-lowest rounded-full border-none text-sm px-2 py-1 hover:bg-white transition-colors cursor-pointer w-full md:w-auto text-on-surface-variant focus:ring-0"></p-select>
        
        <!-- Provider Dropdown -->
        <p-select formControlName="provider" [options]="providers" optionLabel="label" optionValue="value" placeholder="{{ 'medicalRecords.provider' | transloco }}" styleClass="bg-surface-container-lowest rounded-full border-none text-sm px-2 py-1 hover:bg-white transition-colors cursor-pointer w-full md:w-auto text-on-surface-variant focus:ring-0"></p-select>
    </div>
</form>
